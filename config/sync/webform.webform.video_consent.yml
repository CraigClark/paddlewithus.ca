id: video_consent
title: 'Video consent for the Save the club campaign'
description: 'Parent consent for athlete videos filmed for the Save the club campaign.'
categories:
  - Registration
elements: |-
  intro:
    '#type': webform_markup
    '#markup': '<p>This consent is only for the Save the club fundraising campaign, from September to December 2026. It doesn''t change the photo consent on your athlete''s profile.</p><p>We''re filming athletes for short videos to help save the club. Each athlete tells a story about what Petrie means to them. Each video is about 30 seconds.</p><p>The videos will be shared on the club''s website, social media and fundraising page. They may stay up after December 2026, but we won''t film anything new under this consent.</p>'
  participants:
    '#type': webform_entity_checkboxes
    '#title': 'Which athletes are you giving consent for?'
    '#description': 'Select each athlete who may be filmed.'
    '#required': true
    '#target_type': profile
    '#selection_handler': views
    '#selection_settings':
      view:
        view_name: participants
        display_name: er_video_consent
        arguments: {  }
  manage_participants:
    '#type': webform_markup
    '#markup': '<p><a class="btn btn-sm mb-3" href="/user/[current-user:uid]/participant/add?destination=/form/video-consent">Add a family member</a> <a class="btn btn-sm mb-3" href="/user/[current-user:uid]/participant/list">Edit your list of family members</a></p>'
  consent_video:
    '#type': checkbox
    '#title': 'I consent to the club filming the athletes selected above for the Save the club fundraising campaign (September to December 2026) and sharing the videos on the club''s website, social media and fundraising page.'
    '#required': true
  consent_first_name:
    '#type': checkbox
    '#title': 'The club may show their first name in the video.'
  guardian:
    '#type': checkbox
    '#title': 'I am the parent or legal guardian of the athletes selected above.'
    '#required': true
  guardian_name:
    '#type': textfield
    '#title': 'Your full name'
    '#required': true
  withdraw:
    '#type': webform_markup
    '#markup': '<p>To withdraw your consent, email <a href="mailto:petriecanoe@gmail.com">petriecanoe@gmail.com</a>. We''ll remove the videos from the club''s website and social media.</p>'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#attributes':
      class:
        - my-8
    '#submit__label': 'Give consent'
