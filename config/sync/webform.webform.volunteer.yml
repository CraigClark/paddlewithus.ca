id: volunteer
title: 'Volunteer with PICC'
description: 'Tell us how you would like to help. Authenticated members can save a draft and update their interests anytime.'
categories: {  }
elements: |-
  intro:
    '#type': webform_markup
    '#markup': '<p>Thanks for your interest in volunteering with PICC. Pick the roles that sound interesting. We will follow up.</p>'
  first_name:
    '#title': 'First name'
    '#type': textfield
    '#required': true
    '#default_value': '[current-user:field_name:given]'
  last_name:
    '#title': 'Last name'
    '#type': textfield
    '#required': true
    '#default_value': '[current-user:field_name:family]'
  email:
    '#title': Email
    '#type': email
    '#required': true
    '#default_value': '[current-user:mail]'
  roles:
    '#title': 'Which roles are you interested in helping with?'
    '#type': webform_checkboxes_other
    '#required': true
    '#options':
      on_water_safety: 'On-water: safety boat driver and spotter'
      on_water_adaptive: 'On-water: adaptive / Special Olympics support paddler'
      maintenance: 'Equipment and facility maintenance'
      dock: 'Dock install / removal'
      repairs: 'Boat and paddle repairs'
      grounds: 'Clubhouse and grounds upkeep'
      events: 'Regatta / events volunteering'
      fundraising: 'Fundraising / sponsorship'
      communications: 'Communications / social media'
      registration: 'Registration and admin'
      governance: 'Governance / board member'
      photography: Photography
  comments:
    '#title': "Anything you'd like to share, ask, or suggest?"
    '#type': textarea
    '#rows': 4
  retention_notice:
    '#type': webform_markup
    '#markup': "<p><em>We'll keep your volunteer interest on file for 3 years.</em></p>"
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Submit
    '#draft__label': 'Save draft'
