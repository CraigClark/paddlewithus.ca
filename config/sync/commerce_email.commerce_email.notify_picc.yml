-id="e6e447c008a538b666655a90825bf390c">a copy of the waiver</li><li data-list-item-id="ee3ee4962d2e9dd29588f4544c230edb6">a copy of the concussion policy</li><li data-list-item-id="e0232ee1a38ad74e8a51d2ec63a7a4af6">a copy of the code of conduct</li><li data-list-item-id="ed1d74155a78916c91ec710fbaddefbc1">a copy of the swim test policy</li></ul></td></tr><tr><td style="background-color:#f5f5f5;color:#999999;font-size:12px;padding:20px;text-align:center;"><p style="margin:0;">This is an automated message. Please do not reply to this email.</p></td></tr></tbody><!-- Header --><!-- Greeting --><!-- Order Details Box --><!-- Items Ordered --><!-- Footer --><!-- Bottom spacer --></table>'
