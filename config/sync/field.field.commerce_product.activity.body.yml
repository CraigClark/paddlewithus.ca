label: Description
description: "<p><b>Writing tips</b></p>\r\n<ul>\r\n<li><b>Keep it simple:</b> This page isn't where we sell the program, by the time they are here, people are sold.</li>\r\n<li><b>Formatting:</b> Go easy on bold, emphasis and capitals. It's hard to read for some people, this is an accessibility issue.</li>\r\n</ul>\r\n\r\n<p><b>Using the summary field</p>\r\n\r\n<p>This text appears in:</p>\r\n<ul>\r\n  <li>Activity listings</li>\r\n  <li>Search results</li>\r\n  <li>Preview snippets, for example in social media posts when the page is shared</li>\r\n</ul>\r\n\r\n<p>Keep it brief (1–2 sentences). Focus on <em>what the activity is</em> and <em>who it is for</em>.</p>\r\n\r\n"
