r>Email: <a href="mailto:petriecanoe@gmail.com">petriecanoe@gmail.com</a></p></td></tr><tr><td style="background-color:#f5f5f5;color:#999999;font-size:12px;padding:20px;text-align:center;"><p style="margin:0;">This is an automated message. Please do not reply to this email.</p></td></tr></tbody></table>'
