uuid: a00db760-aefc-4a98-bf2b-659964af9b6e
langcode: en
status: true
dependencies:
  config:
    - filter.format.basic_html
  module:
    - ckeditor5
_core:
  default_config_hash: Qi2tIe-L97EutlMmhEvhsNxZOpOoA-RH82c4BQb5n4A
format: basic_html
editor: ckeditor5
settings:
  toolbar:
    items:
      - sourceEditing
      - heading
      - bold
      - italic
      - bulletedList
      - numberedList
      - '|'
      - link
  plugins:
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: false
        styles: false
      multiBlock: false
    ckeditor5_paste_filter_pasteFilter:
      enabled: true
      filters:
        -
          enabled: true
          weight: -38
          search: '<o:p><\/o:p>'
          replace: ''
          description: 'Remove empty Word-specific <o:p> tags.'
        -
          enabled: true
          weight: -37
          search: '(<[^>]*) (style="[^"]*")'
          replace: $1
          description: 'Remove inline style attributes from all tags.'
        -
          enabled: true
          weight: -36
          search: '(<[^>]*) (face="[^"]*")'
          replace: $1
          description: 'Remove font face attributes from tags.'
        -
          enabled: true
          weight: -35
          search: '(<[^>]*) (class="[^"]*")'
          replace: $1
          description: 'Remove class attributes from tags (currently disabled).'
        -
          enabled: true
          weight: -34
          search: '(<[^>]*) (valign="[^"]*")'
          replace: $1
          description: 'Remove vertical alignment attributes from elements.'
        -
          enabled: true
          weight: -33
          search: '<font[^>]*>'
          replace: ''
          description: 'Remove opening <font> tags.'
        -
          enabled: true
          weight: -32
          search: '<\/font>'
          replace: ''
          description: 'Remove closing </font> tags.'
        -
          enabled: true
          weight: -31
          search: '<span[^>]*>'
          replace: ''
          description: 'Remove opening <span> tags.'
        -
          enabled: true
          weight: -30
          search: '<\/span>'
          replace: ''
          description: 'Remove closing </span> tags.'
        -
          enabled: true
          weight: -29
          search: '<p>&nbsp;<\/p>'
          replace: ''
          description: 'Remove <p> tags that only contain &nbsp;.'
        -
          enabled: true
          weight: -28
          search: '<p><\/p>'
          replace: ''
          description: 'Remove empty <p> tags.'
        -
          enabled: true
          weight: -27
          search: '<b><\/b>'
          replace: ''
          description: 'Remove empty bold tags.'
        -
          enabled: true
          weight: -26
          search: '<i><\/i>'
          replace: ''
          description: 'Remove empty italic tags.'
        -
          enabled: true
          weight: -24
          search: '<a name="OLE_LINK[^"]*">(.*?)<\/a>'
          replace: $1
          description: 'Remove anchor links generated by Wordâ€™s OLE linking.'
        -
          enabled: true
          weight: -25
          search: '<([a-z0-9]+)[^>]*class="[^"]*"[^>]*>\s*(?:&nbsp;|\u00a0)?\s*<\/\1>'
          replace: ''
          description: 'Remove empty elements with class that only contain &nbsp;.'
        -
          enabled: true
          weight: -23
          search: '(<[^>]*)( align="[^"]*")'
          replace: $1
          description: 'Remove align attributes from any tag.'
        -
          enabled: true
          weight: -22
          search: '(<[^>]*)( border="[^"]*")'
          replace: $1
          description: 'Remove border attributes from table and other tags.'
        -
          enabled: true
          weight: -21
          search: '(<[^>]*)( cellspacing="[^"]*")'
          replace: $1
          description: 'Remove cellspacing attributes from tables.'
        -
          enabled: true
          weight: -20
          search: '(<[^>]*)( width="[^"]*")'
          replace: $1
          description: 'Remove width attributes from tags.'
        -
          enabled: true
          weight: -19
          search: '(<[^>]*)( abbr="[^"]*")'
          replace: $1
          description: 'Remove abbr attributes, typically from <th> tags.'
        -
          enabled: true
          weight: -18
          search: '(<[^>]*)( bgcolor="[^"]*")'
          replace: $1
          description: 'Remove background color attributes.'
        -
          enabled: true
          weight: -17
          search: '(<[^>]*)( height="[^"]*")'
          replace: $1
          description: 'Remove height attributes from elements.'
        -
          enabled: true
          weight: -16
          search: '(<[^>]*)( valign="[^"]*")'
          replace: $1
          description: 'Remove valign attributes from table cells.'
        -
          enabled: true
          weight: -15
          search: '<h1([^>]*)>'
          replace: '<h2$1>'
          description: 'Convert opening <h1> tags to <h2>.'
        -
          enabled: true
          weight: -14
          search: '<\/h1>'
          replace: '</h2>'
          description: 'Convert closing </h1> tags to </h2>.'
        -
          enabled: true
          weight: -13
          search: '(<p[^>]*>[^<]*?)(&nbsp;|\u00a0)([^<]*<\/p>)'
          replace: '$1 $3'
          description: 'Replace inline non-breaking space with a regular space inside <p> tags.'
        -
          enabled: true
          weight: -12
          search: '(<p[^>]*>)[\s\n\r]*(&nbsp;|\u00a0)[\s\n\r]*'
          replace: $1
          description: 'Remove &nbsp; immediately after opening <p> tag.'
        -
          enabled: true
          weight: -11
          search: '[\s\n\r]*(&nbsp;|\u00a0)[\s\n\r]*(<\/p>)'
          replace: $2
          description: 'Remove &nbsp; immediately before closing </p> tag.'
        -
          enabled: true
          weight: -10
          search: '<tr[^>]*>\s*(<td[^>]*>\s*(?:&nbsp;|\u00a0)?\s*<\/td>\s*){1,}<\/tr>'
          replace: ''
          description: 'Remove empty table rows where all cells contain only &nbsp; or are blank.'
        -
          enabled: true
          weight: -9
          search: '<a[^>]*href="#_msocom_[0-9]+"[^>]*>[\s\S]*?<\/a>'
          replace: ''
          description: 'Remove inline Word comment reference links (e.g. [S1]).'
        -
          enabled: true
          weight: -8
          search: '<p[^>]*>[\s\n\r]*<a[^>]*name="_msocom_\d+"[^>]*><\/a>[\s\n\r]*<\/p>'
          replace: ''
          description: 'Remove anchor-only paragraphs used for Word comments.'
        -
          enabled: true
          weight: -7
          search: '<div[^>]*id="_com_\d+"[^>]*>[\s\S]*?<\/div>\s*<\/div>\s*<\/div>'
          replace: ''
          description: 'Remove entire Word comment blocks (nested <div> structure).'
        -
          enabled: true
          weight: -6
          search: '\s*on(?:mouse(?:over|out))="msoComment(?:Show|Hide)\([^\"]*\)"'
          replace: ''
          description: 'Remove Word comment JS handlers (mouseover/mouseout).'
        -
          enabled: true
          weight: -5
          search: '<hr[^>]*>'
          replace: ''
          description: 'Remove all <hr> elements.'
        -
          enabled: true
          weight: -4
          search: '<a>\s*([\s\S]*?)\s*<\/a>'
          replace: $1
          description: 'Remove <a> tags with no attributes, keeping their content.'
        -
          enabled: true
          weight: -3
          search: '<u[^>]*>'
          replace: ''
          description: 'Remove opening undrline <u> tag'
        -
          enabled: true
          weight: -2
          search: '<\/u>'
          replace: ''
          description: 'Remove closing undrline <u> tag'
        -
          enabled: true
          weight: -1
          search: '<p[^>]*>\s*(?:&nbsp;|&#160;|&#8288;|\u00a0|\u2060|\s)*<\/p>'
          replace: ''
          description: 'Remove multiiline empty paragraphs.'
        -
          enabled: true
          weight: 0
          search: '(<table[^>]*?)\s+cellpadding="[^"]*"'
          replace: $1
          description: 'Remove cell padding from tables'
    ckeditor5_sourceEditing:
      allowed_tags: {  }
    linkit_extension:
      linkit_enabled: true
      linkit_profile: default
image_upload:
  status: true
  scheme: public
  directory: inline-images
  max_size: null
  max_dimensions:
    width: null
    height: null
