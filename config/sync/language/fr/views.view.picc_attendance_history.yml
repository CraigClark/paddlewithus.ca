label: 'Historique des présences'
description: 'Vue admin/gestionnaire des dossiers de présence historiques pour tous les programmes. Export CSV disponible.'
display:
  default:
    display_options:
      title: 'Historique des présences'
      fields:
        date:
          label: Date
        product:
          label: Programme
        participant:
          label: Participant
        check_in_at:
          label: Arrivée
        check_in_by:
          label: 'Arrivée enregistrée par'
        check_out_at:
          label: Départ
        check_out_by:
          label: 'Départ enregistré par'
        check_out_pickup_name:
          label: 'Récupéré par'
        check_out_pickup_source:
          label: Source
        checkout_without_checkin:
          label: 'Sans arrivée'
        check_in_note:
          label: "Note d'arrivée"
        check_out_note:
          label: 'Note de départ'
      header:
        legend:
          content: "<div class=\"attendance-legend\"><span class=\"attendance-legend__label\">Légende :</span><span class=\"attendance-legend__item attendance-legend__item--no-show\"><span class=\"attendance-legend__swatch\"></span>Aucune présence</span><span class=\"attendance-legend__item attendance-legend__item--incomplete\"><span class=\"attendance-legend__swatch\"></span>Dossier incomplet</span></div>"
      footer:
        result:
          content: '<div class="attendance-history-result-count"><span class="text-xl font-semibold">@total</span> dossiers</div>'
      filters:
        date_from:
          expose:
            label: 'À partir du'
        date_to:
          expose:
            label: "Jusqu'au"
        product_selective:
          expose:
            label: Programme
        checkout_without_checkin:
          expose:
            label: "N'afficher que les départs sans arrivée"
        checkin_without_checkout:
          expose:
            label: "N'afficher que les arrivées sans départ"
        pickup_other_only:
          expose:
            label: "N'afficher que les récupérations par personne non autorisée"
          group_info:
            label: "N'afficher que les récupérations par personne non autorisée"
            group_items:
              1:
                title: "N'afficher que les récupérations par personne non autorisée"
  page_1:
    display_options:
      menu:
        title: 'Historique des présences'
        description: 'Parcourir et exporter les dossiers de présence archivés.'
