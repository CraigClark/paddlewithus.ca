  policy_info:
    '#text': '<h3>Politiques et attentes en matière de sécurité</h3><p>Les politiques ci-dessous sont en place pour aider à assurer la sécurité de tous, offrir un environnement de soutien et permettre à chacun de profiter pleinement des activités de pagaie. Elles expliquent comment nous gérons les risques, ce que nous attendons des participants et des familles, et comment nous intervenons en cas de problème de sécurité sur l’eau ou à terre.</p><p>Veuillez prendre un moment pour lire chaque politique. En donnant votre accord, vous confirmez comprendre ces attentes et vous engager à contribuer à une expérience sécuritaire et positive pour tous les participants.</p><drupal-entity data-entity-type="node" data-entity-uuid="75bda914-483e-4dfb-bd8e-b46a5e53b10a" data-embed-button="node" data-entity-embed-display="view_mode:node.details">&nbsp;</drupal-entity><drupal-entity data-entity-type="node" data-entity-uuid="4787287a-681d-46f6-b289-839820928e70" data-embed-button="node" data-entity-embed-display="view_mode:node.details">&nbsp;</drupal-entity><drupal-entity data-entity-type="node" data-entity-uuid="e668b1df-3897-4a27-a3dd-1aad94ca113f" data-embed-button="node" data-entity-embed-display="view_mode:node.details">&nbsp;</drupal-entity><drupal-entity data-entity-type="node" data-entity-uuid="91bf1982-5de8-4eec-afc4-b7f5cea54bdb" data-embed-button="node" data-entity-embed-display="view_mode:node.details">&nbsp;</drupal-entity>'
  waiver_agreement_authority:
