    '#text': '<h2>Information importante</h2><h3>Décharge de responsabilité</h3><p>Les activités de pagayage comportent des risques. Des blessures peuvent survenir, même lorsque les règles de sécurité sont respectées.</p><p>En vous inscrivant, vous acceptez que :</p><ul><li data-list-item-id="ee41f32dec4c5ad8a51f0c9d64409ed3f">La participation est un choix personnel</li><li data-list-item-id="e0dbc720343bbff3d0e3682364f5df34c">Vous comprenez les risques associés</li><li data-list-item-id="eed6307378e0914cc17a352c74d0023ec">Vous (ou votre enfant) êtes en condition physique suffisante pour participer</li><li data-list-item-id="e417790ec7bf7045aceac1cbc770236f2">Vous respecterez toutes les règles et consignes de sécurité</li><li data-list-item-id="e8308ea06d603c8abf02152c1774970c3">Le Petrie Island Canoe Club n’est pas responsable des blessures, pertes ou dommages pouvant survenir pendant les activités</li></ul><p>Si le participant a moins de 18 ans, un parent ou un tuteur légal accepte en son nom.</p><details class="collapse collapse-arrow bg-base-100 border-base-300 border border-primary my-8"><summary class="collapse-title font-semibold">Veuillez lire la décharge complète ci-dessous avant de continuer.</summary><div class="p-3"><drupal-entity data-entity-type="node" data-entity-uuid="7f452406-4e01-4f45-bf55-e57d1d596ca7" data-embed-button="node" data-entity-embed-display="view_mode:node.full">&nbsp;</drupal-entity></div></details><h3>Politique relative au test de natation</h3><drupal-entity data-entity-type="node" data-entity-uuid="059c3a16-99e7-4339-bb5c-54cb9def9ec8" data-embed-button="node" data-entity-embed-display="view_mode:node.full">&nbsp;</drupal-entity>'
