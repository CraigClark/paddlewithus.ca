label: 'Confirmation du test de natation au parent'
subject: "[site:name] - Confirmation d'inscription au test de natation"
body:
  value: '<table class="table" style="color:#333333;font-family:Arial, sans-serif;margin-bottom:0;margin-top:0;max-width:600px;width:100%px;" cellpadding="0" cellspacing="0"><tbody><tr><td style="background-color:#0066cc;padding:20px;text-align:center;"><h1 style="color:#ffffff;font-size:24px;margin:0;">Inscription au test de natation</h1></td></tr><tr><td style="background-color:#ffffff;padding:20px;"><p style="font-size:16px;margin:0 0 15px;">Bonjour [commerce_order:uid:entity:display-name],</p><p style="font-size:14px;margin:0 0 15px;">Votre inscription au test de natation a été confirmée. Veuillez consulter les détails ci-dessous.</p></td></tr><tr><td style="background-color:#ffffff;padding:0 20px 20px;"><h2 style="color:#0066cc;font-size:18px;margin:0 0 15px;">Participants inscrits :</h2><div style="background-color:#fafafa;border:1px solid #dddddd;padding:15px;">[commerce_order:order_items_formatted]</div></td></tr><tr><td style="background-color:#ffffff;padding:0 20px 20px;"><table class="table" style="background-color:#fff8e1;border:1px solid #ffe082;width:100%px;" cellpadding="0" cellspacing="0"><tbody><tr><td style="padding:15px;"><p style="font-size:14px;margin:0 0 10px;"><strong>Important :</strong></p><ul style="font-size:14px;margin:0;padding-left:20px;"><li style="margin-bottom:8px;">Veuillez arriver à l''heure pour votre test de natation prévu.</li><li style="margin-bottom:8px;">Si vous ne pouvez pas vous présenter, veuillez communiquer avec nous dès que possible à <a href="mailto:petriecanoe@gmail.com">petriecanoe@gmail.com</a> pour annuler votre inscription.</li><li style="margin-bottom:0;">Des frais de 20 $ par participant s''appliqueront pour la prochaine réservation de test de natation si un participant inscrit ne se présente pas.</li></ul></td></tr></tbody></table></td></tr><tr><td style="background-color:#ffffff;border-top:1px solid #dddddd;padding:20px;"><p style="font-size:14px;margin:0 0 10px;">Si vous avez des questions, veuillez communiquer avec nous.</p><p style="color:#666666;font-size:14px;margin:0;"><strong>Club de canoë-kayak de l''île Petrie</strong><br>Courriel : <a href="mailto:petriecanoe@gmail.com">petriecanoe@gmail.com</a></p></td></tr><tr><td style="background-color:#f5f5f5;color:#999999;font-size:12px;padding:20px;text-align:center;"><p style="margin:0;">Ceci est un message automatisé. Veuillez ne pas répondre à ce courriel.</p></td></tr></tbody></table>'
