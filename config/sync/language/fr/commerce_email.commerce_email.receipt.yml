label: "Reçu pour l'activité"
subject: '[site:name] - Reçu pour la commande [commerce_order:order_number]'
body:
  value: "<table class=\"table\" style=\"color:#333333;font-family:Arial, sans-serif;margin-bottom:0;margin-top:0;max-width:600px;width:100%px;\" cellpadding=\"0\" cellspacing=\"0\">\r\n    <tbody>\r\n        <tr>\r\n            <td style=\"background-color:#0066cc;padding:20px;text-align:center;\">\r\n                <h1 style=\"color:#ffffff;font-size:24px;margin:0;\">\r\n                    Confirmation de votre commande\r\n                </h1>\r\n            </td>\r\n        </tr>\r\n        <tr>\r\n            <td style=\"background-color:#ffffff;padding:20px;\">\r\n                <p style=\"font-size:16px;margin:0 0 15px;\">\r\n                    Bonjour [commerce_order:uid:entity:display-name],\r\n                </p>\r\n                <p style=\"font-size:14px;margin:0 0 15px;\">\r\n                    Merci de vous être inscrit auprès de [site:name] ! Votre commande a été confirmée.\r\n                </p>\r\n            </td>\r\n        </tr>\r\n        <tr>\r\n            <td style=\"background-color:#ffffff;padding:0 20px 20px;\">\r\n                <table class=\"table\" style=\"background-color:#f5f5f5;border-color:#dddddd;border-style:solid;width:100%px;\" cellpadding=\"0\" cellspacing=\"0\">\r\n                    <tbody>\r\n                        <tr>\r\n                            <td style=\"padding:15px;\">\r\n                                <table class=\"table\" style=\"width:100%px;\" cellpadding=\"5\" cellspacing=\"0\">\r\n                                    <tbody>\r\n                                        <tr>\r\n                                            <td style=\"font-size:14px;\">\r\n                                                <strong>Numéro de commande :</strong>\r\n                                            </td>\r\n                                            <td style=\"font-size:14px;text-align:right;\">\r\n                                                [commerce_order:order_number]\r\n                                            </td>\r\n                                        </tr>\r\n                                        <tr>\r\n                                            <td style=\"font-size:14px;\">\r\n                                                <strong>Date de la commande :</strong>\r\n                                            </td>\r\n                                            <td style=\"font-size:14px;text-align:right;\">\r\n                                                [commerce_order:completed]\r\n                                            </td>\r\n                                        </tr>\r\n                                        <tr>\r\n                                            <td style=\"border-top:2px solid #0066cc;font-size:14px;padding-top:10px;\">\r\n                                                <strong>Total :</strong>\r\n                                            </td>\r\n                                            <td style=\"border-top:2px solid #0066cc;color:#0066cc;font-size:16px;padding-top:10px;text-align:right;\">\r\n                                                <strong>[commerce_order:total_price]</strong>\r\n                                            </td>\r\n                                        </tr>\r\n                                    </tbody>\r\n                                </table>\r\n                                <p>\r\n                                    <em>Si vous vous êtes inscrit au tarif promotionnel, votre inscription n’est pas remboursable.</em>\r\n                                </p>\r\n                            </td>\r\n                        </tr>\r\n                    </tbody>\r\n                </table>\r\n            </td>\r\n        </tr>\r\n        <tr>\r\n            <td style=\"background-color:#ffffff;padding:0 20px 20px;\">\r\n                <h2 style=\"color:#0066cc;font-size:18px;margin:0 0 15px;\">\r\n                    Détails de l'inscription :\r\n                </h2>\r\n                <div style=\"background-color:#fafafa;border:1px solid #dddddd;padding:15px;\">\r\n                    [commerce_order:order_items_formatted]\r\n                </div>\r\n            </td>\r\n        </tr>\r\n        <tr>\r\n            <td style=\"background-color:#ffffff;border-top:1px solid #dddddd;padding:20px;\">\r\n                <p style=\"font-size:14px;margin:0 0 10px;\">\r\n                    Si vous avez des questions, n'hésitez pas à communiquer avec nous.\r\n                </p>\r\n                <p style=\"color:#666666;font-size:14px;margin:0;\">\r\n                    <strong>Club de canot de l'île Petrie</strong><br>\r\n                    Courriel : petriecanoe@gmail.com\r\n                </p>\r\n            </td>\r\n        </tr>\r\n        <tr>\r\n            <td style=\"background-color:#f5f5f5;color:#999999;font-size:12px;padding:20px;text-align:center;\">\r\n                <p style=\"margin:0;\">\r\n                    Ceci est un message automatisé. Veuillez ne pas répondre à ce courriel.\r\n                </p>\r\n            </td>\r\n        </tr>\r\n    </tbody>\r\n</table>"
