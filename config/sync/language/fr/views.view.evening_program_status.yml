display:
  default:
    display_options:
      fields:
        changed:
          alter:
            text: '<p>Dernière mise à jour {{ changed }}</p>'
        edit_block_content:
          text: modifier
        field_evening_program_status:
          alter:
            text: "{% if changed_1|striptags|trim == \"now\"|date(\"Y-m-d\") %}<section class=\"evening-prog-status {{ field_evening_program_status__value }}\">\r\n<p><strong>{{ field_evening_program_status }}</strong></p>\r\n{{ changed }}\r\n{{ edit_block_content }}\r\n</section>{% else %}<section class=\"evening-prog-status program_no_update\">\r\n<p>L’état des programmes de ce soir n’a pas été mis à jour aujourd’hui.</p>\r\n{{ edit_block_content }}\r\n</section>{% endif %}"
