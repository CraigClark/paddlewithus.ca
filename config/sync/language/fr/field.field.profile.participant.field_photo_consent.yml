label: 'Consentement photo'
description: "<p>Le club peut prendre des photos et des vidéos durant les programmes à des fins promotionnelles sur son site Web, ses médias sociaux, ses infolettres et son matériel de marketing. Les photos et vidéos ne sont jamais vendues ni partagées avec des tiers à des fins commerciales.</p>\r\n<p><em>Ce consentement s’applique à tous les programmes auxquels ce participant est inscrit. Vous pouvez le modifier en tout temps en mettant à jour le profil de ce participant.</em></p>\r\n"
settings:
  on_label: 'Je consens à ce que ce participant soit photographié ou filmé à des fins promotionnelles.'
  off_label: 'Je ne consens pas à ce que ce participant soit photographié ou filmé.'
