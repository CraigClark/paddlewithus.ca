title: 'Consentement vidéo pour la campagne Sauvons le club'
description: "Consentement des parents pour les vidéos d'athlètes filmées pour la campagne Sauvons le club."
elements: |
  intro:
    '#markup': '<p>Ce consentement s''applique seulement à la campagne de financement Sauvons le club, de septembre à décembre 2026. Il ne modifie pas le consentement photo inscrit au profil de votre athlète.</p><p>Nous filmons des athlètes pour de courtes vidéos afin d''aider à sauver le club. Chaque athlète raconte ce que Petrie représente pour lui. Chaque vidéo dure environ 30 secondes.</p><p>Les vidéos seront publiées sur le site Web du club, ses médias sociaux et sa page de collecte de fonds. Elles pourraient rester en ligne après décembre 2026, mais nous ne filmerons rien de nouveau en vertu de ce consentement.</p>'
  participants:
    '#title': 'Pour quels athlètes donnez-vous votre consentement?'
    '#description': 'Sélectionnez chaque athlète qui peut être filmé.'
  manage_participants:
    '#markup': '<p><a class="btn btn-sm mb-3" href="/fr/user/[current-user:uid]/participant/add?destination=/fr/form/video-consent">Ajouter un membre de la famille</a> <a class="btn btn-sm mb-3" href="/fr/user/[current-user:uid]/participant/list">Modifier votre liste de membres de la famille</a></p>'
  consent_video:
    '#title': 'Je consens à ce que le club filme les athlètes sélectionnés ci-dessus pour la campagne de financement Sauvons le club (de septembre à décembre 2026) et publie les vidéos sur son site Web, ses médias sociaux et sa page de collecte de fonds.'
  consent_first_name:
    '#title': 'Le club peut afficher leur prénom dans la vidéo.'
  guardian:
    '#title': 'Je suis le parent ou le tuteur légal des athlètes sélectionnés ci-dessus.'
  guardian_name:
    '#title': 'Votre nom complet'
  withdraw:
    '#markup': '<p>Pour retirer votre consentement, écrivez à <a href="mailto:petriecanoe@gmail.com">petriecanoe@gmail.com</a>. Nous retirerons les vidéos du site Web et des médias sociaux du club.</p>'
  actions:
    '#title': 'Bouton(s) d''envoi'
    '#submit__label': 'Donner mon consentement'
settings:
  form_close_message: '<p>La campagne Sauvons le club est terminée. Nous ne recueillons plus de consentement vidéo.</p>'
  form_access_denied_message: '<p>Connectez-vous ou créez un compte pour donner votre consentement vidéo.</p>'
  confirmation_title: 'Consentement enregistré'
  confirmation_message: '<p>Merci. Votre consentement vidéo a été enregistré.</p>'
