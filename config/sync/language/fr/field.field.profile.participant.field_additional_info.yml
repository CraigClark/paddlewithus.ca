label: 'Informations supplémentaires pour les entraîneurs'
description: "<p class=\"text-xs\">S’il y a quoi que ce soit que nos entraîneurs devraient savoir pour vous aider, vous ou un membre de votre famille, à participer de façon sécuritaire et confortable (par exemple : considérations médicales, besoins d’apprentissage ou sensoriels, ou toute autre information pertinente), veuillez l’indiquer ici.</p>\r\n\r\n<p class=\"text-xs\"><em>Ces renseignements sont facultatifs et seront utilisés uniquement par le personnel du programme à des fins de sécurité et de soutien.</em></p>"
