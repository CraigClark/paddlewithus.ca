description: "<p><b>Conseils de rédaction</b></p>\r\n<ul>\r\n<li><b>Restez simple :</b> Cette page n’est pas l’endroit où l’on vend le programme. À ce stade, les personnes sont déjà convaincues.</li>\r\n<li><b>Mise en forme :</b> Utilisez avec modération le gras, l’emphase et les majuscules. Cela peut nuire à la lisibilité pour certaines personnes; c’est un enjeu d’accessibilité.</li>\r\n</ul>\r\n\r\n<p><b>Utilisation du champ Résumé</b></p>\r\n\r\n<p>Ce texte apparaît dans :</p>\r\n<ul>\r\n  <li>Les listes d’activités</li>\r\n  <li>Les résultats de recherche</li>\r\n  <li>Les extraits d’aperçu, par exemple dans les publications sur les médias sociaux lorsque la page est partagée</li>\r\n</ul>\r\n\r\n<p>Restez bref (1 à 2 phrases). Mettez l’accent sur <em>ce qu’est l’activité</em> et <em>à qui elle s’adresse</em>.</p>"
