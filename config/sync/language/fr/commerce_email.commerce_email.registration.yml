label: 'Trousse d’inscription'
subject: '[site:name] – Renseignements d’inscription pour la commande [commerce_order:order_number]'
body:
  value: "<p>Bonjour [commerce_order:uid:entity:display-name],</p>\r\n\r\n<p>\r\n    Merci de votre inscription auprès de [site:name] !\r\n</p>\r\n\r\n<p>\r\n    Voici votre copie de la décharge de responsabilité et des autres politiques que vous avez acceptées lors de votre inscription à un programme du Petrie Island Canoe Club.\r\n</p>\r\n\r\n<p>\r\n    Si une personne que vous avez inscrite doit passer un test de natation, nous communiquerons avec vous pour vous fournir plus de détails.\r\n    <br><br>\r\n    Veuillez conserver ce courriel pour vos dossiers.\r\n    <br>\r\n    Numéro de commande : [commerce_order:order_number]\r\n    <br>\r\n    Date de la commande : [commerce_order:completed]\r\n</p>\r\n\r\n<hr>\r\n\r\n<h2>Consentement éclairé, acceptation des risques, décharge de responsabilité et renonciation à toute réclamation</h2>\r\n\r\n<drupal-entity\r\n    data-entity-type=\"node\"\r\n    data-entity-uuid=\"75bda914-483e-4dfb-bd8e-b46a5e53b10a\"\r\n    data-embed-button=\"node\"\r\n    data-entity-embed-display=\"view_mode:node.full\"\r\n>&nbsp;</drupal-entity>\r\n\r\n<hr>\r\n\r\n<h2>Code de conduite relatif aux commotions cérébrales pour les athlètes et les parents ou tuteurs légaux</h2>\r\n\r\n<drupal-entity\r\n    data-entity-type=\"node\"\r\n    data-entity-uuid=\"4787287a-681d-46f6-b289-839820928e70\"\r\n    data-embed-button=\"node\"\r\n    data-entity-embed-display=\"view_mode:node.full\"\r\n>&nbsp;</drupal-entity>\r\n\r\n<hr>\r\n\r\n<h2>Code de conduite</h2>\r\n\r\n<drupal-entity\r\n    data-entity-type=\"node\"\r\n    data-entity-uuid=\"e668b1df-3897-4a27-a3dd-1aad94ca113f\"\r\n    data-embed-button=\"node\"\r\n    data-entity-embed-display=\"view_mode:node.full\"\r\n>&nbsp;</drupal-entity>\r\n\r\n<hr>\r\n\r\n<h2>Politique sur le test de natation</h2>\r\n\r\n<drupal-entity\r\n    data-entity-type=\"node\"\r\n    data-entity-uuid=\"91bf1982-5de8-4eec-afc4-b7f5cea54bdb\"\r\n    data-embed-button=\"node\"\r\n    data-entity-embed-display=\"view_mode:node.full\"\r\n>&nbsp;</drupal-entity>"
