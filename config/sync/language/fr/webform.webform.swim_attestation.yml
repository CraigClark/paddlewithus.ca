title: 'Attestation de natation'
elements: |
  processed_text:
    '#text': '<p>Conformément à la politique relative au test de natation :</p><ul><li data-list-item-id="e66b29240f9ecf8a966c03e5261620de0">Les parents ou tuteurs de tous les participants âgés de 15 à 18 ans doivent confirmer que les participants sont des nageurs compétents.</li><li data-list-item-id="e22c6e69f1316f6f3f9be419b582b179c">Tous les participants de plus de 18 ans doivent confirmer qu’ils sont des nageurs compétents.</li></ul>'
  participants:
    '#title': '<h2>Sélectionner les participants</h2>'
    '#description': "<p>Sélectionnez les membres de la famille pour lesquels vous attestez qu'ils savent nager.</p>"
  manage_participants:
    '#markup': '<p><a class="btn btn-sm mb-3" href="/fr/user/[current-user:uid]/participant/list">✏️ Modifiez votre liste de membres de la famille.</a></p>'
  attestation_agreement:
    '#title': 'Je confirme que les participants sélectionnés ci-dessus sont capables de se laisser tomber en eau profonde, de faire du surplace pendant 1 minute et de nager 50 mètres sans aide.'
  actions:
    '#title': "Bouton(s) d'envoi"
    '#submit__label': "Soumettre l'attestation"
settings:
  form_close_message: "<p>L'attestation de natation n'est pas disponible pour le moment.</p>"
  form_access_denied_message: '<p>Connectez-vous ou créez un compte pour soumettre une attestation de natation.</p>'
  confirmation_title: 'Attestation soumise'
  confirmation_message: '<p>Merci. Votre attestation de natation a été enregistrée.</p>'
handlers:
  picc_swim_attestation_handler:
    label: "Gestionnaire d'attestation de natation CICIP"
  email_parent:
    label: "Confirmation d'attestation au parent"
    settings:
      subject: "[site:name] - Confirmation d'attestation de natation"
      body: '<table class="table" style="color:#333333;font-family:Arial, sans-serif;margin-bottom:0;margin-top:0;max-width:600px;width:100%px;" cellpadding="0" cellspacing="0"><tbody><tr><td style="background-color:#0066cc;padding:20px;text-align:center;"><h1 style="color:#ffffff;font-size:24px;margin:0;">Attestation de natation</h1></td></tr><tr><td style="background-color:#ffffff;padding:20px;"><p style="font-size:16px;margin:0 0 15px;">Bonjour [current-user:display-name],</p><p style="font-size:14px;margin:0 0 15px;">Merci d''avoir soumis votre attestation de natation [current-date:custom:Y]. Ceci confirme que les participants suivants ont été attestés comme sachant nager.</p></td></tr><tr><td style="background-color:#ffffff;padding:0 20px 20px;"><h2 style="color:#0066cc;font-size:18px;margin:0 0 15px;">Participants :</h2><div style="background-color:#fafafa;border:1px solid #dddddd;font-size:14px;padding:15px;">[webform_submission:values:participants:entity:field_name]</div></td></tr><tr><td style="background-color:#ffffff;border-top:1px solid #dddddd;padding:20px;"><p style="font-size:14px;margin:0 0 10px;">Si vous avez des questions, veuillez communiquer avec nous.</p><p style="color:#666666;font-size:14px;margin:0;"><strong>Club de canoë-kayak de l''île Petrie</strong><br>Courriel : <a href="mailto:petriecanoe@gmail.com">petriecanoe@gmail.com</a></p></td></tr><tr><td style="background-color:#f5f5f5;color:#999999;font-size:12px;padding:20px;text-align:center;"><p style="margin:0;">Ceci est un message automatisé. Veuillez ne pas répondre à ce courriel.</p></td></tr></tbody></table>'
  email_picc:
    label: "Notification CICIP d'attestation de natation"
    settings:
      subject: 'Attestation de natation - [current-user:display-name]'
      body: '<table class="table" style="color:#333333;font-family:Arial, sans-serif;margin-bottom:0;margin-top:0;max-width:600px;width:100%px;" cellpadding="0" cellspacing="0"><tbody><tr><td style="background-color:#0066cc;padding:20px;text-align:center;"><h1 style="color:#ffffff;font-size:24px;margin:0;">Attestation de natation</h1></td></tr><tr><td style="background-color:#ffffff;padding:20px;"><p style="font-size:16px;margin:0 0 15px;">Attestation par : [current-user:display-name]<br>Contact : [current-user:mail]</p></td></tr><tr><td style="background-color:#ffffff;padding:0 20px 20px;"><h2 style="color:#0066cc;font-size:18px;margin:0 0 15px;">Participants attestés :</h2><div style="background-color:#fafafa;border:1px solid #dddddd;font-size:14px;padding:15px;">[webform_submission:values:participants:entity:field_name]</div></td></tr><tr><td style="background-color:#f5f5f5;color:#999999;font-size:12px;padding:20px;text-align:center;"><p style="margin:0;">Ceci est un message automatisé.</p></td></tr></tbody></table>'
