subject: '[commerce_order:uid:entity:display-name] a passé une commande'
body:
  value: '<table class="table" style="color:#333333;font-family:Arial, sans-serif;margin-bottom:0;margin-top:0;max-width:600px;width:100%px;" cellpadding="0" cellspacing="0"><tbody><tr><td style="background-color:#0066cc;padding:20px;text-align:center;"><h1 style="color:#ffffff;font-size:24px;margin:0;">Détails de la commande</h1></td></tr><tr><td style="background-color:#ffffff;padding:20px;"><p style="font-size:16px;margin:0 0 15px;">Commande passée par : [commerce_order:uid:entity:display-name]<br>Coordonnées : [commerce_order:uid:entity:mail]</p></td></tr><tr><td style="background-color:#ffffff;padding:0 20px 20px;"><table class="table" style="background-color:#f5f5f5;border-color:#dddddd;border-style:solid;width:100%px;" cellpadding="0" cellspacing="0"><tbody><tr><td style="padding:15px;"><table class="table" style="width:100%px;" cellpadding="5" cellspacing="0"><tbody><tr><td style="font-size:14px;"><strong>Numéro de commande :</strong></td><td style="font-size:14px;text-align:right;">[commerce_order:order_number]</td></tr><tr><td style="font-size:14px;"><strong>Date de la commande :</strong></td><td style="font-size:14px;text-align:right;">[commerce_order:completed]</td></tr><tr><td style="border-top:2px solid #0066cc;font-size:14px;padding-top:10px;"><strong>Total :</strong></td><td style="border-top:2px solid #0066cc;color:#0066cc;font-size:16px;padding-top:10px;text-align:right;"><strong>[commerce_order:total_price]</strong></td></tr></tbody></table></td></tr></tbody></table></td></tr><tr><td style="background-color:#ffffff;padding:0 20px 20px;"><h2 style="color:#0066cc;font-size:18px;margin:0 0 15px;">Détails de l’inscription :</h2><div style="background-color:#fafafa;border:1px solid #dddddd;padding:15px;">[commerce_order:order_items_formatted]</div></td></tr><tr><td style="background-color:#ffffff;border-top:1px solid #dddddd;padding:20px;"><p>[commerce_order:uid:entity:display-name] a reçu :</p><ul><li data-list-item-id="ef591947f756f3ba77c53b83569cef8ec">un reçu</li><li data-list-item-id="e6e447c008a538b666655a90825bf390c">une copie de la décharge</li><li data-list-item-id="ee3ee4962d2e9dd29588f4544c230edb6">une copie de la politique sur les commotions cérébrales</li><li data-list-item-id="e0232ee1a38ad74e8a51d2ec63a7a4af6">une copie du code de conduite</li><li data-list-item-id="ed1d74155a78916c91ec710fbaddefbc1">une copie de la politique relative au test de nage</li></ul></td></tr><tr><td style="background-color:#f5f5f5;color:#999999;font-size:12px;padding:20px;text-align:center;"><p style="margin:0;">Ceci est un message automatisé. Veuillez ne pas répondre à ce courriel.</p></td></tr></tbody><!-- Header --><!-- Greeting --><!-- Order Details Box --><!-- Items Ordered --><!-- Footer --><!-- Bottom spacer --></table>'
