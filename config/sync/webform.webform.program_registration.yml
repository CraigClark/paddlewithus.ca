elements: |-
  product_id:
    '#type': hidden
    '#title': 'Product ID'
    '#default_value': '[current-page:query:product]'
  variation_id:
    '#type': hidden
    '#title': 'Variation ID'
    '#default_value': '[current-page:query:variation]'
  participants:
    '#type': webform_entity_checkboxes
    '#title': '<h2>Select Participants</h2>'
    '#required': true
    '#target_type': profile
    '#selection_handler': views
    '#selection_settings':
      view:
        view_name: participants
        display_name: er_participants
        arguments: {  }
  manage_participants:
    '#type': webform_markup
    '#markup': '<p><a class="btn btn-sm ml-3 mb-3" href="/user/[current-user:uid]/participant/add?destination=/webform/program_registration?variation=[current-page:query:variation]">➕ Add a new family member</a> <a class="btn btn-sm mb-3" href="/user/[current-user:uid]/participant/list">✏️ Edit your list of family members.</a></p>'
  hr__1:
    '#type': processed_text
    '#text': '<hr class="h-px my-8 bg-neutral-quaternary border-0">'
    '#format': full_html
  policy_info:
    '#type': processed_text
    '#wrapper_attributes':
      class:
        - mt-12
    '#text': '<h3>Policies and safety expectations</h3><p>The policies below are in place to help keep everyone safe, supported, and able to enjoy paddling. They explain how we manage risk, what we expect from participants and families, and how we respond to safety issues on and off the water.</p><p>Please take a moment to review each policy. By agreeing, you confirm that you understand these expectations and are committed to helping create a safe and positive experience for all participants.</p><drupal-entity data-entity-type="node" data-entity-uuid="75bda914-483e-4dfb-bd8e-b46a5e53b10a" data-embed-button="node" data-entity-embed-display="view_mode:node.details">&nbsp;</drupal-entity><drupal-entity data-entity-type="node" data-entity-uuid="4787287a-681d-46f6-b289-839820928e70" data-embed-button="node" data-entity-embed-display="view_mode:node.details">&nbsp;</drupal-entity><drupal-entity data-entity-type="node" data-entity-uuid="e668b1df-3897-4a27-a3dd-1aad94ca113f" data-embed-button="node" data-entity-embed-display="view_mode:node.details">&nbsp;</drupal-entity><drupal-entity data-entity-type="node" data-entity-uuid="91bf1982-5de8-4eec-afc4-b7f5cea54bdb" data-embed-button="node" data-entity-embed-display="view_mode:node.details">&nbsp;</drupal-entity>'
    '#format': full_html
  waiver_agreement_authority:
    '#type': checkbox
    '#title': 'I confirm that I am at least 18 years of age and have the legal authority to agree to this waiver on behalf of myself and all participants I am registering.'
    '#required': true
  waiver_agreement:
    '#type': checkbox
    '#title': ' I have read and agree to the <em>Release of Liability and Waiver of Claims</em>.'
    '#required': true
  concussion_acknowledgment:
    '#type': checkbox
    '#title': 'I understand and agree to the <em>Concussion Code of Conduct</em>.'
    '#required': true
  code_of_conduct_acknowledgment:
    '#type': checkbox
    '#title': 'I understand and agree to the <em>Code of Conduct</em>.'
    '#required': true
  swim_test_acknowledgment:
    '#type': checkbox
    '#title': 'I understand and agree to the <em>Swim Test Policy</em>.'
    '#required': true
  notify_by_email:
    '#type': processed_text
    '#text': '<p class="text-gray-500 text-sm">You will be emailed a copy of all policies and the waiver that you agreed to.</p>'
    '#format': full_html
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#attributes':
      class:
        - my-8
    '#submit__label': Register
