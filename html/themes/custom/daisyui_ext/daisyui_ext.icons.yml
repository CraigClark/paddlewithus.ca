material_icons:
  enabled: true
  label: "Material Icons"
  description: "Curated subset of Material Icons baseline glyphs available to authors. To expose more icons, add their name + codepoint to icons/material-icons.codepoints and clear cache."
  extractor: font
  config:
    sources:
      - "icons/material-icons.codepoints"
  settings:
    size:
      title: Size
      type: "integer"
      minimum: 12
      maximum: 128
      multipleOf: 4
      default: 24
    alt:
      title: "Alt text"
      type: "string"
      description: "Accessibility alternative text, leave empty for decorative icon."
    title:
      title: "Tooltip"
      type: "string"
      description: "Tooltip text shown on hover. Leave empty for no tooltip."
    color:
      title: "Color"
      type: "string"
      enum:
        - text-primary
        - text-primary-content
        - text-secondary
        - text-secondary-content
        - text-accent
        - text-accent-content
        - text-neutral
        - text-neutral-content
        - text-base-100
        - text-base-200
        - text-base-300
        - text-base-content
        - text-info
        - text-info-content
        - text-success
        - text-success-content
        - text-warning
        - text-warning-content
        - text-error
        - text-error-content
  template: >
    <span
      class="material-icons {{ color|default('') }}"
      {% if size %}style="font-size: {{ size }}px;"{% endif %}
      {% if title %}title="{{ title }}"{% endif %}
      {% if alt %}role="img" aria-label="{{ alt }}"{% else %}aria-hidden="true"{% endif %}
    >{{ icon_id }}</span>
  preview: '<span class="material-icons" style="font-size: {{ size|default(32) }}px;" aria-hidden="true">{{ icon_id }}</span>'

daisyui_ext_icon_pack:
  enabled: true
  label: "Site icons"
  description: "Custom SVG icons (brand logos, etc.) bundled into the theme. To add an icon, drop the .svg file in icons/default/ and run npm run build."
  extractor: svg_sprite
  config:
    sources:
      - "dist/assets/default-icons.svg"
  settings:
    size:
      title: Size
      type: "integer"
      minimum: 12
      maximum: 128
      multipleOf: 4
      default: 16
    alt:
      title: "Alt text"
      type: "string"
      description: "Accessibility alternative text, leave empty for decorative icon."
    title:
      title: "Semantic title"
      type: "string"
      description: "If this icon convey meaning, provide text-based alternatives, leave empty for decorative icon."
    color:
      title: "Color"
      type: "string"
      enum:
        - text-primary
        - text-primary-content
        - text-secondary
        - text-secondary-content
        - text-accent
        - text-accent-content
        - text-neutral
        - text-neutral-content
        - text-base-100
        - text-base-200
        - text-base-300
        - text-base-content
        - text-info
        - text-info-content
        - text-success
        - text-success-content
        - text-warning
        - text-warning-content
        - text-error
        - text-error-content
  template: >
    <svg
        class="{{ color|default('text-base-content') }}"
        width="{{ size|default(32) }}"
        height="{{ size|default(32) }}"
        aria-hidden="true"
        {% if alt %}
        aria-label="{{ alt }}"
        {% endif %}
        >
        {% if title %}
        <title>{{ title }}</title>
        {% endif %}
        <use href="{{ source }}#{{ icon_id }}"/>
    </svg>
